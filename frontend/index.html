<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Metaverse Office: Spatial Audio</title>
    <!-- Load Socket.IO from CDN -->
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
      /* --- GLOBAL STYLES --- */
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 20px;
        padding: 20px;
        height: calc(100vh - 40px);
        background-color: #f0f2f5;
        margin: 0;
        overflow: hidden;
      }

      /* --- SIDEBAR --- */
      .sidebar {
        background: #fff;
        border-radius: 12px;
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        display: flex;
        flex-direction: column;
        z-index: 10;
      }
      .sidebar h2 { margin-top: 0; font-size: 20px; color: #333; }
      #connectionStatus {
        padding: 10px; border-radius: 8px; margin-bottom: 20px;
        text-align: center; font-weight: bold; font-size: 14px;
      }
      .disconnected { background-color: #ffeeba; color: #856404; }
      .connected { background-color: #d4edda; color: #155724; }

      .form-group { margin-bottom: 15px; }
      label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 13px; color: #555; }
      input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
      button#connectBtn {
        width: 100%; padding: 12px; border: none; border-radius: 6px;
        background-color: #007bff; color: white; font-weight: 600; cursor: pointer;
        transition: background 0.2s;
      }
      button#connectBtn:hover { background-color: #0056b3; }
      button:disabled { background-color: #ccc; cursor: not-allowed; }

      #usersList { margin-top: 20px; flex-grow: 1; overflow-y: auto; }
      .user-item {
        padding: 10px; background: #f8f9fa; border-radius: 6px;
        margin-bottom: 8px; font-size: 13px; border-left: 4px solid #ddd;
        display: flex; justify-content: space-between; align-items: center;
      }

      /* --- MAP AREA --- */
      .map-container {
        background: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        position: relative;
        overflow: hidden;
      }
      #map {
        width: 100%; height: 100%;
        background: #e9ecef; /* Light gray floor */
        background-image: radial-gradient(#ced4da 1px, transparent 1px);
        background-size: 20px 20px; /* Grid pattern */
        position: relative;
        cursor: crosshair;
      }

      /* --- USER MARKERS --- */
      .user-marker {
        position: absolute;
        width: 32px; height: 32px;
        border-radius: 50%;
        border: 3px solid white;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        transform: translate(-50%, -50%);
        /* Smooth movement */
        transition: left 0.1s linear, top 0.1s linear, border-color 0.2s;
        display: flex; align-items: center; justify-content: center;
        font-size: 12px; font-weight: bold; color: white;
        z-index: 5;
      }
      .user-marker::after {
        content: attr(data-username);
        position: absolute; top: 36px;
        font-size: 11px; background: rgba(0, 0, 0, 0.8);
        color: white; padding: 4px 8px; border-radius: 4px;
        white-space: nowrap; pointer-events: none;
      }
      /* Collision Feedback */
      .collision { border-color: #dc3545 !important; animation: shake 0.3s; }
      @keyframes shake {
        0%, 100% { transform: translate(-50%, -50%); }
        25% { transform: translate(-55%, -50%); }
        75% { transform: translate(-45%, -50%); }
      }

      #coordinates {
        position: absolute; bottom: 15px; left: 15px;
        background: rgba(0, 0, 0, 0.6); color: white;
        padding: 6px 12px; border-radius: 20px; font-size: 12px;
        pointer-events: none; z-index: 20;
      }

      /* --- MODALS (Proximity & Call) --- */
      #proximityModal {
        position: absolute; bottom: 20px; right: 20px;
        width: 280px; background: white; border-radius: 12px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 15px;
        display: none; z-index: 1000;
        animation: slideUp 0.3s ease-out;
      }
      @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

      .modal-header { font-weight: bold; font-size: 14px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
      .nearby-card {
        display: flex; align-items: center; padding: 10px;
        background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; border: 1px solid #eee;
      }
      .nearby-avatar {
        width: 32px; height: 32px; background: #e9ecef; border-radius: 50%;
        display: flex; align-items: center; justify-content: center;
        font-weight: bold; color: #555; margin-right: 10px; font-size: 12px;
      }
      .nearby-info { flex-grow: 1; }
      .nearby-name { font-size: 13px; font-weight: 600; color: #333; }
      .nearby-dist { font-size: 11px; color: #888; }
      .connect-btn {
        padding: 6px 12px; font-size: 11px; background: #28a745;
        color: white; border: none; border-radius: 20px; cursor: pointer;
      }
      .connect-btn:hover { background: #218838; }

      #incomingCallModal {
        position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
        width: 320px; background: #2c3e50; color: white;
        border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
        padding: 25px; display: none; z-index: 2000; text-align: center;
        animation: slideDown 0.3s ease-out;
      }
      @keyframes slideDown { from { transform: translate(-50%, -50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }
      
      .caller-avatar {
        width: 70px; height: 70px; background: rgba(255,255,255,0.15);
        border-radius: 50%; margin: 0 auto 15px;
        display: flex; align-items: center; justify-content: center; font-size: 30px;
      }
      .call-actions { display: flex; gap: 15px; margin-top: 20px; }
      .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
      .btn-accept { background: #2ecc71; color: white; } .btn-accept:hover { background: #27ae60; }
      .btn-reject { background: #e74c3c; color: white; } .btn-reject:hover { background: #c0392b; }

      /* --- ACTIVE VIDEO OVERLAY --- */
      #activeCallOverlay {
        position: absolute; top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.95); display: none; z-index: 3000;
        flex-direction: column; justify-content: center; align-items: center; color: white;
      }
      .video-wrapper {
        position: relative; width: 80%; height: 70%;
        display: flex; justify-content: center; align-items: center;
        background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #333;
      }
      #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
      #localVideo {
        position: absolute; bottom: 20px; right: 20px;
        width: 200px; height: 150px; background: #222;
        border-radius: 8px; border: 2px solid white; object-fit: cover;
        z-index: 3001; transition: transform 0.3s ease;
      }
      #localVideo:hover { transform: scale(1.05); }

      /* Controls Bar */
      .controls-bar {
        display: flex; gap: 15px; margin-top: 20px; padding: 15px 30px;
        background: rgba(255,255,255,0.1); border-radius: 50px; backdrop-filter: blur(10px);
      }
      .control-btn {
        width: 50px; height: 50px; border-radius: 50%; border: none;
        display: flex; align-items: center; justify-content: center;
        cursor: pointer; transition: all 0.2s; background: #343a40; color: white;
      }
      .control-btn svg { width: 24px; height: 24px; fill: currentColor; }
      .control-btn:hover { background: #495057; transform: translateY(-2px); }
      .control-btn.off { background: #dc3545; color: white; }
      .control-btn.active-share { background: #007bff; }
      .btn-hangup { background: #dc3545; margin-left: 15px; }
      .btn-hangup:hover { background: #c82333; }

      /* Spatial Audio Volume Slider */
      #volumeControl {
        position: absolute; top: 20px; right: 20px;
        background: rgba(0,0,0,0.6); padding: 10px 15px;
        border-radius: 30px; display: flex; align-items: center; gap: 10px;
        z-index: 3002; backdrop-filter: blur(4px);
      }
      #volumeControl span { color: white; font-size: 12px; font-weight: 600; min-width: 50px; }
      #volumeControl input[type=range] { width: 100px; height: 4px; accent-color: #28a745; cursor: pointer; }
    </style>
  </head>
  <body>
    <!-- Sidebar -->
    <div class="sidebar">
      <h2>📍 Metaverse Office</h2>
      <div id="connectionStatus" class="disconnected">Disconnected</div>
      
      <div class="form-group">
        <label>Your Name</label>
        <input type="text" id="username" placeholder="Enter Name" />
      </div>
      <div class="form-group">
        <label>Room ID</label>
        <input type="text" id="roomId" value="lobby-1" />
      </div>
      
      <button id="connectBtn" onclick="connectToRoom()">Join Room</button>
      
      <div id="usersList">
        <h3 style="font-size: 14px; color: #666; margin-bottom: 10px;">Active Users</h3>
        <div id="userListContainer"></div>
      </div>
    </div>

    <!-- Map & Overlays -->
    <div class="map-container">
      <div id="map"></div>
      <div id="coordinates">(0, 0)</div>

      <!-- Phase 3: Proximity List -->
      <div id="proximityModal">
        <div class="modal-header">
          <span>👋 People Nearby</span>
          <span id="nearbyCount" style="background:#e9ecef; padding:2px 6px; border-radius:10px; font-size:11px">0</span>
        </div>
        <div id="nearbyList"></div>
      </div>

      <!-- Phase 4: Incoming Call -->
      <div id="incomingCallModal">
        <div class="caller-avatar" id="callerAvatar">?</div>
        <h3 id="callerName">Unknown</h3>
        <p style="margin-bottom:20px; font-size:14px; color:#ccc;">is requesting a video call...</p>
        <div class="call-actions">
          <button class="btn-action btn-reject" onclick="rejectCall()">Decline</button>
          <button class="btn-action btn-accept" onclick="acceptCall()">Accept</button>
        </div>
      </div>

      <!-- Phase 5-9: Active Video & Spatial Audio -->
      <div id="activeCallOverlay">
        <div id="volumeControl">
            <span id="volumeLabel">🔊 100%</span>
            <input type="range" id="volumeSlider" min="0" max="200" value="100" oninput="updateVolume(this.value)" title="Spatial Volume Boost">
        </div>

        <h2>📞 Call with <span id="remoteUserName">...</span></h2>
        
        <div class="video-wrapper">
            <video id="remoteVideo" autoplay playsinline></video>
            <video id="localVideo" autoplay playsinline muted></video>
        </div>
        
        <!-- Media Controls -->
        <div class="controls-bar">
            <button id="btnMic" class="control-btn" onclick="toggleMic()" title="Toggle Mic">
                <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            </button>
            <button id="btnCam" class="control-btn" onclick="toggleCam()" title="Toggle Camera">
                <svg viewBox="0 0 24 24"><path d="M15 8v8H5V8h10m1-2H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4V7c0-.55-.45-1-1-1z"/></svg>
            </button>
            <button id="btnShare" class="control-btn" onclick="toggleScreenShare()" title="Share Screen">
               <svg viewBox="0 0 24 24"><path d="M20 18c1.1 0 1.99-.9 1.99-2L22 6c0-1.11-.9-2-2-2H4c-1.11 0-2 .89-2 2v10c0 1.1.89 2 2 2H0v2h24v-2h-4zM4 6h16v10H4V6zm9 7h-2v-3H8l4-4 4 4h-3z"/></svg>
            </button>
            <button class="control-btn btn-hangup" onclick="endCall()" title="End Call">
                <svg viewBox="0 0 24 24"><path d="M12 9c-1.6 0-3.15.25-4.6.72l-1.2-1.2c2.53-1.41 5.42-2.18 8.3-2.18s5.77.77 8.3 2.18l-1.2 1.2C15.15 9.25 13.6 9 12 9zm0-6c-2.73 0-5.22.75-7.4 2.06l-1.2-1.2C6.32 2.13 9.07 1 12 1s5.68 1.13 8.6 2.86l-1.2 1.2C17.22 3.75 14.73 3 12 3zm7.43 12.28l-2.54.29c-.61.07-1.21-.23-1.45-.78l-1.3-2.91c-.2-.44-.07-.96.31-1.26l1.83-1.83c-1.9-2-4.5-2-6.4 0l1.83 1.83c.38.3.51.82.31 1.26l-1.3 2.91c-.24.55-.84.85-1.45.78l-2.54-.29c-.65-.08-1.15-.63-1.15-1.28V12c0-4.08 3.05-7.44 7-7.93v2.02c-2.83.48-5 2.94-5 5.91h1.8l1.49 3.35.93-.11c.39-.04.67-.38.63-.77l-.13-1.12c3.9.5 7.1 3.7 7.6 7.6l-1.12-.13c-.39-.04-.73.24-.77.63l-.11.93 3.35 1.49v1.8c0 .65-.5 1.15-1.15 1.15zM12 21c-4.97 0-9-4.03-9-9h2c0 3.87 3.13 7 7 7s7-3.13 7-7h2c0 4.97-4.03 9-9 9z"/></svg>
            </button>
        </div>
      </div>
    </div>

    <script>
      // --- GLOBAL STATE ---
      let socket = null;
      let currentUser = null;
      let userMarkers = new Map(); 
      let nearbyUsersMap = new Map();
      let currentIncomingCallerId = null;
      let isDragging = false;
      
      // --- MEDIA STATE ---
      let peerConnection = null;
      let localStream = null;
      let remoteCallUserId = null;
      let isMicOn = true;
      let isCamOn = true;
      let isScreenSharing = false;
      let originalVideoTrack = null;
      let audioContext = null;
      let gainNode = null;
      let masterVolume = 1.0;
      let currentSpatialGain = 1.0;

      const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
      
      // --- DOM ELEMENTS ---
      const map = document.getElementById('map');
      const coordsEl = document.getElementById('coordinates');
      const userListContainer = document.getElementById('userListContainer');
      const proximityModal = document.getElementById('proximityModal');
      const nearbyList = document.getElementById('nearbyList');
      const nearbyCountEl = document.getElementById('nearbyCount');
      const incomingCallModal = document.getElementById('incomingCallModal');
      const callerNameEl = document.getElementById('callerName');
      const callerAvatarEl = document.getElementById('callerAvatar');
      const activeCallOverlay = document.getElementById('activeCallOverlay');
      const remoteUserNameEl = document.getElementById('remoteUserName');
      const localVideo = document.getElementById('localVideo');
      const remoteVideo = document.getElementById('remoteVideo');
      const btnMic = document.getElementById('btnMic');
      const btnCam = document.getElementById('btnCam');
      const btnShare = document.getElementById('btnShare');
      const volumeControl = document.getElementById('volumeControl');
      const volumeLabel = document.getElementById('volumeLabel');

      // Pre-fill
      document.getElementById('username').value = `User${Math.floor(Math.random() * 1000)}`;

      // --- SETUP ---
      function setStatus(msg, connected) {
        const el = document.getElementById('connectionStatus');
        el.textContent = msg;
        el.className = connected ? 'connected' : 'disconnected';
        document.getElementById('connectBtn').disabled = connected;
        document.getElementById('username').disabled = connected;
        document.getElementById('roomId').disabled = connected;
      }

      function connectToRoom() {
        const username = document.getElementById('username').value.trim();
        const roomId = document.getElementById('roomId').value.trim();
        
        if (!username || !roomId) return alert('Enter details');
        if (typeof io === 'undefined') return alert('Socket.IO not loaded');

        currentUser = { userId: `user-${Date.now()}`, username, roomId };
        socket = io('http://localhost:3001', { transports: ['websocket', 'polling'] });

        socket.on('connect', () => {
          console.log('✅ Socket Connected');
          socket.emit('joinRoom', { ...currentUser });
        });

        // Room State
        socket.on('roomJoined', (data) => {
          setStatus(`Connected: ${roomId}`, true);
          userListContainer.innerHTML = '';
          if(data.locations && Array.isArray(data.locations)) {
             data.locations.forEach(loc => renderUserMarker(loc));
          }
          sendInitialLocation();

          // Setup Disconnect Logic on Page Unload (FIX for Ghost Users)
          window.addEventListener('beforeunload', () => {
             if(socket) {
                 socket.emit('leaveRoom', { roomId: currentUser.roomId });
                 socket.disconnect();
             }
          });
        });

        socket.on('userJoined', (data) => {
           console.log('User Joined:', data);
           addUserToList(data);
        });
        
        // Location Updates (Server Authority)
        socket.on('locationUpdate', (data) => {
            renderUserMarker(data);
            // Phase 9: Update Spatial Audio if calling this user
            if (remoteCallUserId && data.userId === remoteCallUserId) {
                updateSpatialAudio(data.x, data.y);
            }
        });
        
        socket.on('userLeft', (data) => {
          const marker = userMarkers.get(data.userId);
          if(marker) marker.remove();
          userMarkers.delete(data.userId);
          handleProximityClear([data.userId]);
          const el = document.querySelector(`[data-userid="${data.userId}"]`);
          if(el) el.remove();
        });

        // Collision Feedback
        socket.on('movementRejected', (data) => {
          const marker = userMarkers.get(currentUser.userId);
          if (marker) {
            marker.classList.add('collision');
            setTimeout(() => marker.classList.remove('collision'), 300);
          }
        });

        // Proximity Radar
        socket.on('proximity-alert', (data) => {
          data.users.forEach(u => {
            nearbyUsersMap.set(u.userId, u);
            const m = userMarkers.get(u.userId);
            if(m) m.style.borderColor = '#28a745'; 
          });
          updateProximityUI();
        });

        socket.on('proximity-clear', (data) => handleProximityClear(data.userIds));

        // Calling
        socket.on('incoming-call', (data) => {
          console.log('Incoming Call:', data);
          currentIncomingCallerId = data.callerId;
          document.getElementById('callerName').textContent = data.callerName;
          document.getElementById('callerAvatar').textContent = data.callerName[0].toUpperCase();
          incomingCallModal.style.display = 'block';
        });

        socket.on('call-sent', () => alert('Calling... Waiting for response.'));

        socket.on('call-ready', (data) => {
          console.log('Call Started!');
          incomingCallModal.style.display = 'none';
          proximityModal.style.display = 'none';
          activeCallOverlay.style.display = 'flex';
          document.getElementById('remoteUserName').textContent = data.remoteUserId;
          remoteCallUserId = data.remoteUserId;
          startWebRTC(data.isInitiator);
        });

        socket.on('call-ended', (data) => {
            alert(`Call ended by ${data.enderName}`);
            cleanupCallState();
        });

        // WebRTC Signals
        socket.on('webrtc-offer', async (data) => {
          if (!peerConnection) return;
          await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
          const answer = await peerConnection.createAnswer();
          await peerConnection.setLocalDescription(answer);
          socket.emit('webrtc-answer', { toUserId: data.senderId, signal: answer });
        });

        socket.on('webrtc-answer', async (data) => {
          if (peerConnection) await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
        });

        socket.on('webrtc-ice-candidate', async (data) => {
          if (peerConnection) try { await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate)); } catch (e) {}
        });
      }

      // --- PHASE 9: SPATIAL AUDIO & VOLUME ---
      function setupAudioContext(stream) {
        try {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioContext = new AudioContext();
            const source = audioContext.createMediaStreamSource(stream);
            gainNode = audioContext.createGain();
            
            // Source -> GainNode -> Destination (Speakers)
            source.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            // Resume AudioContext if state is suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            // Initialize volume
            applyVolume();
            console.log("🔊 Spatial Audio Initialized");
        } catch (e) {
            console.error("Web Audio API Error:", e);
        }
      }

      function updateSpatialAudio(remoteX, remoteY) {
        if (!currentUser) return;
        const m = userMarkers.get(currentUser.userId);
        if (!m) return;
        
        const myX = parseFloat(m.style.left);
        const myY = parseFloat(m.style.top);
        
        const dist = Math.sqrt(Math.pow(myX - remoteX, 2) + Math.pow(myY - remoteY, 2));
        
        // 0-300px Range
        let volume = 1 - (dist / 300);
        if (volume < 0) volume = 0;
        
        currentSpatialGain = volume;
        applyVolume();
      }

      function updateVolume(val) { masterVolume = val / 100; applyVolume(); }
      function applyVolume() {
          const final = currentSpatialGain * masterVolume;
          if (gainNode) gainNode.gain.value = final;
          volumeLabel.textContent = `🔊 ${(final * 100).toFixed(0)}%`;
      }

      // --- WEBRTC SETUP ---
      async function startWebRTC(isInitiator) {
        try {
          localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          localVideo.srcObject = localStream;

          peerConnection = new RTCPeerConnection(rtcConfig);
          localStream.getTracks().forEach(t => peerConnection.addTrack(t, localStream));

          peerConnection.onicecandidate = (e) => {
            if (e.candidate) socket.emit('webrtc-ice-candidate', { toUserId: remoteCallUserId, signal: e.candidate });
          };

          peerConnection.ontrack = (e) => {
            remoteVideo.srcObject = e.streams[0];
            if (e.streams[0].getAudioTracks().length > 0) {
               setupAudioContext(e.streams[0]);
               // Mute raw video element audio to avoid echo/double audio
               remoteVideo.muted = true;
            }
          };

          if (isInitiator) {
            const offer = await peerConnection.createOffer();
            await peerConnection.setLocalDescription(offer);
            socket.emit('webrtc-offer', { toUserId: remoteCallUserId, signal: offer });
          }
        } catch (err) {
          console.error(err);
          alert('Camera error: ' + err.message);
          cleanupCallState();
        }
      }

      // --- MEDIA CONTROLS ---
      function toggleMic() {
        if (localStream) {
            const track = localStream.getAudioTracks()[0];
            if (track) {
                isMicOn = !isMicOn;
                track.enabled = isMicOn;
                btnMic.classList.toggle('off', !isMicOn);
            }
        }
      }

      function toggleCam() {
        if (localStream) {
            const track = localStream.getVideoTracks()[0];
            if (track) {
                isCamOn = !isCamOn;
                track.enabled = isCamOn;
                btnCam.classList.toggle('off', !isCamOn);
            }
        }
      }
      
      async function toggleScreenShare() {
        if (isScreenSharing) stopScreenShare(); else startScreenShare();
      }

      async function startScreenShare() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            const track = stream.getVideoTracks()[0];
            originalVideoTrack = localStream.getVideoTracks()[0];
            const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
            if(sender) await sender.replaceTrack(track);
            localVideo.srcObject = stream;
            isScreenSharing = true; btnShare.classList.add('active-share');
            track.onended = () => stopScreenShare();
        } catch(e){}
      }

      async function stopScreenShare() {
        const sender = peerConnection.getSenders().find(s => s.track.kind === 'video');
        if(sender && originalVideoTrack) await sender.replaceTrack(originalVideoTrack);
        localVideo.srcObject = localStream;
        isScreenSharing = false; btnShare.classList.remove('active-share');
      }

      // --- UI HELPERS ---
      function renderUserMarker(data) {
        if (!data || !data.userId) return;
        let marker = userMarkers.get(data.userId);
        
        if (!marker) {
          marker = document.createElement('div');
          marker.className = 'user-marker';
          marker.textContent = data.username[0].toUpperCase();
          marker.setAttribute('data-username', data.username);
          map.appendChild(marker);
          userMarkers.set(data.userId, marker);
          addUserToList(data);
        }
        
        marker.style.left = `${data.x}px`;
        marker.style.top = `${data.y}px`;

        const isMe = data.userId === currentUser.userId;
        marker.style.backgroundColor = isMe ? '#007bff' : getColor(data.userId);
        
        if (!isMe && !nearbyUsersMap.has(data.userId)) {
            marker.style.borderColor = 'white';
        }
      }

      function sendInitialLocation() {
        const x = Math.floor(Math.random() * 400) + 50;
        const y = Math.floor(Math.random() * 300) + 50;
        const payload = { ...currentUser, x, y };
        // Note: Removed optimistic renderUserMarker(payload) to enforce collision logic
        socket.emit('updateLocation', payload);
      }

      function handleProximityClear(ids) {
        ids.forEach(id => {
          nearbyUsersMap.delete(id);
          const m = userMarkers.get(id);
          if(m) m.style.borderColor = 'white';
        });
        updateProximityUI();
      }

      function updateProximityUI() {
        const users = Array.from(nearbyUsersMap.values());
        if (users.length === 0) {
          proximityModal.style.display = 'none';
          return;
        }
        proximityModal.style.display = 'block';
        document.getElementById('nearbyCount').textContent = users.length;
        nearbyList.innerHTML = users.map(u => `
          <div class="nearby-card">
            <div class="nearby-avatar">${u.username[0].toUpperCase()}</div>
            <div class="nearby-info">
              <div style="font-weight:600">${u.username}</div>
              <div style="font-size:11px; color:#666">${u.distance}px away</div>
            </div>
            <button class="connect-btn" onclick="initiateCall('${u.userId}')">Connect</button>
          </div>
        `).join('');
      }

      // --- CALL ACTIONS ---
      window.initiateCall = (targetId) => {
        socket.emit('call-request', { targetUserId: targetId });
      };

      window.acceptCall = () => {
        if (currentIncomingCallerId) socket.emit('call-accepted', { callerId: currentIncomingCallerId });
      };

      window.rejectCall = () => {
        incomingCallModal.style.display = 'none';
        currentIncomingCallerId = null;
      };

      window.endCall = () => {
        if (remoteCallUserId) {
            socket.emit('call-ended', { toUserId: remoteCallUserId });
        }
        cleanupCallState();
      };

      function cleanupCallState() {
        activeCallOverlay.style.display = 'none';
        
        if (localStream) {
            localStream.getTracks().forEach(t => t.stop());
            localStream = null;
        }
        if (peerConnection) {
            peerConnection.close();
            peerConnection = null;
        }
        remoteVideo.srcObject = null;
        localVideo.srcObject = null;
        remoteCallUserId = null;

        // Show proximity modal again if users are still close
        if (nearbyUsersMap.size > 0) {
            proximityModal.style.display = 'block';
        }
      }

      function addUserToList(u) {
        if (document.querySelector(`[data-userid="${u.userId}"]`)) return;
        const el = document.createElement('div');
        el.className = 'user-item';
        el.dataset.id = u.userId;
        el.textContent = `${u.username} (${u.userId.slice(-4)})`;
        el.style.borderLeft = `4px solid ${getColor(u.userId)}`;
        el.setAttribute('data-userid', u.userId);
        userListContainer.appendChild(el);
      }

      function removeUserFromList(id) {
        const el = document.querySelector(`[data-userid="${id}"]`);
        if (el) el.remove();
      }

      function getColor(id) {
        if (!id) return '#ccc';
        let hash = 0;
        for (let i = 0; i < id.length; i++) hash = id.charCodeAt(i) + ((hash << 5) - hash);
        return `hsl(${hash % 360}, 70%, 50%)`;
      }

      // --- MAP INTERACTION ---
      const handleMove = (e) => {
        if (!socket || !currentUser) return;
        e.preventDefault();
        const rect = map.getBoundingClientRect();
        const cx = e.clientX || (e.touches && e.touches[0].clientX);
        const cy = e.clientY || (e.touches && e.touches[0].clientY);
        
        const x = Math.max(15, Math.min(Math.round(cx - rect.left), rect.width - 15));
        const y = Math.max(15, Math.min(Math.round(cy - rect.top), rect.height - 15));
        
        document.getElementById('coordinates').textContent = `(${x}, ${y})`;
        
        if (e.type === 'mousedown' || e.type === 'touchstart') isDragging = true;
        if (e.type === 'mouseup' || e.type === 'touchend') isDragging = false;
        
        if (isDragging || e.type === 'click') {
          const payload = { ...currentUser, x, y };
          socket.emit('updateLocation', payload);
          // removed optimistic renderUserMarker(payload)
        }
      };

      ['mousedown','mousemove','mouseup','click','touchstart','touchmove','touchend'].forEach(evt => 
        map.addEventListener(evt, handleMove)
      );
    </script>
  </body>
</html>
